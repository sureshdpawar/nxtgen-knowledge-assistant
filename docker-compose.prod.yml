services:

  postgres:
    image: pgvector/pgvector:pg17
    container_name: nxtgen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - nxtgen-network

  backend:
    image: knowgentiq-backend:${APP_IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nxtgen-backend
    restart: unless-stopped
    env_file:
      - .env.prod
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - storage_data:/app/storage
      - ${GOOGLE_SERVICE_ACCOUNT_HOST_FILE}:/run/secrets/google-service-account.json:ro
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    networks:
      - nxtgen-network

  backend-worker:
    image: knowgentiq-backend:${APP_IMAGE_TAG:-latest}
    container_name: nxtgen-backend-worker
    restart: unless-stopped
    env_file:
      - .env.prod
    command: ["python", "-m", "app.workers.ingestion_worker"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - storage_data:/app/storage
      - ${GOOGLE_SERVICE_ACCOUNT_HOST_FILE}:/run/secrets/google-service-account.json:ro
    networks:
      - nxtgen-network

  mcp:
    image: knowgentiq-backend:${APP_IMAGE_TAG:-latest}
    container_name: nxtgen-mcp
    restart: unless-stopped
    env_file:
      - .env.prod
    command:
      ["uvicorn", "mcp_servers.academy.server:app", "--host", "0.0.0.0", "--port", "9000"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${GOOGLE_SERVICE_ACCOUNT_HOST_FILE}:/run/secrets/google-service-account.json:ro
    expose:
      - "9000"
    networks:
      - nxtgen-network

  frontend:
    image: knowgentiq-frontend:${APP_IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: nxtgen-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    networks:
      - nxtgen-network

volumes:
  postgres_data:
    name: nxtgen-postgres-data
  storage_data:
    name: nxtgen-storage-data

networks:
  nxtgen-network:
    name: nxtgen-network
    driver: bridge
