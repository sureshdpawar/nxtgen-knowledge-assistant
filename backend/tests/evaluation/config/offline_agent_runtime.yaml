suite:
  name: knowgentiq-offline-agent-runtime-learning
target:
  agent_id_env: KNOWGENTIQ_EVAL_AGENT_ID
  agent_name_env: KNOWGENTIQ_EVAL_AGENT_NAME
judge:
  model: gpt-5.4
  verbose: false
metrics:
  outcome_correctness:
    threshold: 0.80
  tool_correctness:
    threshold: 1.00
  argument_correctness:
    threshold: 0.80
