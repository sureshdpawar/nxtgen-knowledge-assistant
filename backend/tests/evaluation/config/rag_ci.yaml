suite:
  name: knowgentiq-rag-ci
  description: >
    End-to-end RAG quality evaluation for
    the Knowgentiq knowledge pipeline.

target:
  knowledge_base_id: "<your-kb-id>"

judge:
  llm_configuration_id: "<your-evaluator-llm-profile-id>"

retrieval:
  top_k: 5

metrics:
  faithfulness:
    enabled: true
    threshold: 0.80

  answer_relevancy:
    enabled: true
    threshold: 0.80

  contextual_precision:
    enabled: true
    threshold: 0.80

  contextual_recall:
    enabled: true
    threshold: 0.80

  contextual_relevancy:
    enabled: true
    threshold: 0.80

execution:
  fail_on_threshold: true
  fail_fast: false